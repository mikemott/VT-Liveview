name: Security Scanning

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Run weekly security scan on Mondays at 9 AM
    - cron: '0 9 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  codeql:
    name: CodeQL Analysis (JavaScript/TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  dependency-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate || {
            echo "❌ npm audit found vulnerabilities"
            npm audit
            exit 1
          }
          echo "✓ No moderate or higher vulnerabilities found"

      - name: Check backend dependencies
        working-directory: ./backend
        run: |
          echo "Auditing backend dependencies..."
          npm audit --audit-level=moderate || {
            echo "❌ Backend npm audit found vulnerabilities"
            npm audit
            exit 1
          }
          echo "✓ Backend: no moderate or higher vulnerabilities"

  security-checks:
    name: Custom Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for common secret patterns..."
          # API keys, tokens, credentials
          ! grep -r -E "(api[_-]?key|api[_-]?secret|password|token)\s*[:=]\s*['\"][a-zA-Z0-9]{20,}" src/ backend/src/ --exclude-dir=node_modules || exit 1

          # AWS keys
          ! grep -r "AKIA[0-9A-Z]{16}" . --exclude-dir=.git --exclude-dir=node_modules || exit 1

          # Private keys
          ! grep -r "BEGIN (RSA |DSA |EC )?PRIVATE KEY" . --exclude-dir=.git --exclude-dir=node_modules || exit 1

          echo "✓ No obvious secrets found"

      - name: Check for .env files in repo
        run: |
          if git ls-files | grep -E "^\.env$|^backend/\.env$"; then
            echo "ERROR: .env file found in repository"
            exit 1
          fi
          echo "✓ No .env files committed"

      - name: SQL Injection Check (D1 queries)
        run: |
          echo "Checking for potential SQL injection risks in D1 queries..."
          # Look for string concatenation in SQL queries
          if grep -r -n "execute.*\`.*\${" backend/src/ --include="*.js" --include="*.ts"; then
            echo "⚠️  Warning: Potential SQL injection risk found"
            echo "Review the above lines for string interpolation in SQL queries"
            echo "Use parameterized queries instead"
            exit 1
          fi
          echo "✓ No obvious SQL injection patterns found"

      - name: Environment Variable Leak Check
        run: |
          echo "Checking for environment variable leaks..."
          # Look for env vars being logged or exposed
          if grep -r -n "console\.log.*process\.env" src/ backend/src/ --exclude-dir=node_modules; then
            echo "⚠️  Warning: Environment variables being logged"
            exit 1
          fi
          echo "✓ No environment variable leaks detected"

      - name: CORS Configuration Check
        run: |
          echo "Checking CORS configuration in backend..."
          if grep -r "origin.*\*" backend/src/ --include="*.js" --include="*.ts"; then
            echo "⚠️  Warning: CORS allows all origins (*)"
            echo "Ensure this is intentional for development only"
          else
            echo "✓ CORS configuration looks safe"
          fi

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones disabled for better analysis

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=vt-liveview
            -Dsonar.organization=mikemott
            -Dsonar.sources=src,backend/src
            -Dsonar.tests=src/**/*.test.js,backend/src/**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [codeql, dependency-audit, security-checks]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "CodeQL: ${{ needs.codeql.result }}"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Security Checks: ${{ needs.security-checks.result }}"

          if [ "${{ needs.codeql.result }}" == "failure" ] || \
             [ "${{ needs.dependency-audit.result }}" == "failure" ] || \
             [ "${{ needs.security-checks.result }}" == "failure" ]; then
            echo "❌ Security scan failed - review findings above"
            exit 1
          fi

          echo "✅ All security scans passed"

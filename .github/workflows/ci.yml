name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: frontend
            dir: .
          - name: backend
            dir: backend

    defaults:
      run:
        working-directory: ${{ matrix.package.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned in .nvmrc; keep in sync with backend/Dockerfile
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package.name }}
          path: ${{ matrix.package.dir }}/coverage
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.project }})
    # Pinned: ubuntu-latest is migrating to Ubuntu 26 (from 2026-10-19), and
    # during the rollout WebKit installs stalled and its rendering was unstable
    # in visual snapshots. Revisit once Playwright supports 26 (VTL-59).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, mobile]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The mobile project emulates Pixel 7 on Chromium
          key: playwright-ubuntu-24.04-${{ matrix.project == 'webkit' && 'webkit' || 'chromium' }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps ${{ matrix.project == 'webkit' && 'webkit' || 'chromium' }}

      - name: Install Playwright browser
        # Download only (no apt), so a stalled attempt can be killed and retried
        # without leaving a dpkg lock behind (VTL-59).
        env:
          BROWSER: ${{ matrix.project == 'webkit' && 'webkit' || 'chromium' }}
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install "$BROWSER"; then
              exit 0
            fi
            echo "::warning::Playwright $BROWSER download attempt $attempt failed or timed out"
          done
          exit 1

      - name: Run E2E tests
        # Missing snapshot baselines are written (and uploaded below) instead of
        # failing; committed baselines are compared strictly. See ADR 0002.
        run: npx playwright test --project=${{ matrix.project }} --update-snapshots=missing

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Upload new snapshot baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.project }}
          path: e2e/**/*-snapshots/*-${{ matrix.project }}-linux.png
          if-no-files-found: ignore
          retention-days: 14
